
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alaxø - Ton IA toujours avec toi</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  padding: 20px;
  border-bottom: 1px solid #292929;
  font-size: 25px;
  font-weight: bold;
}
.logo { color: white; }
.logo span { color: #65a9ff; }
main {
  flex: 1;
  overflow-y: auto;
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.welcome {
  text-align: center;
  margin: auto;
}
.welcome h1 { font-size: 30px; }
.welcome p { color: #999; }
.message {
  padding: 15px;
  border-radius: 15px;
  max-width: 85%;
  line-height: 1.5;
  white-space: pre-wrap;
}
.user {
  background: #292929;
  align-self: flex-end;
}
.ai {
  background: #171717;
  align-self: flex-start;
}
footer {
  padding: 15px;
  border-top: 1px solid #292929;
}
form {
  display: flex;
  gap: 9px;
  background: #202020;
  border: 1px solid #444;
  border-radius: 25px;
  padding: 8px 12px;
}
input {
  flex: 1;
  min-width: 0;
  background: transparent;
  color: white;
  border: none;
  outline: none;
  font-size: 16px;
}
button {
  background: #65a9ff;
  color: #080808;
  border: none;
  border-radius: 50%;
  width: 43px;
  height: 43px;
  font-size: 20px;
  cursor: pointer;
}
.small {
  text-align: center;
  color: #777;
  font-size: 11px;
  margin-top: 10px;
}
</style>
</head>
<body>
<header>
  <div class="logo">Alax<span>ø</span></div>
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <h1>Bonjour !</h1>
    <p>Je suis Alaxø, ton IA toujours avec toi.</p>
    <p>Que veux-tu savoir aujourd'hui ?</p>
  </div>
</main>

<footer>
  <form id="form">
    <input id="question" placeholder="Pose ta question à Alaxø..." autocomplete="off">
    <button type="submit">↑</button>
  </form>
  <div class="small">Alaxø peut se tromper. Vérifie les informations importantes.</div>
</footer>

<script>
const form = document.getElementById("form");
const input = document.getElementById("question");
const chat = document.getElementById("chat");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

form.addEventListener("submit", function(e) {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;

  document.getElementById("welcome")?.remove();
  addMessage(question, "user");
  input.value = "";

  addMessage(
    "Bienvenue sur Alaxø ! Cette première version est prête visuellement. La connexion à une véritable intelligence artificielle sera ajoutée dans une prochaine étape.",
    "ai"
  );
});
</script>
</body>
</html>
